<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interests Boxes Select</title>
    <!-- Render All Elements Normally -->
    <link rel="stylesheet" href="css/normalize.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="css/all.min.css">
    <!-- Main Template CSS File -->
    <link rel="stylesheet" href="css/main.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet">
  </head>
<body>
  <!-- Start Choose Interests -->
  <h2>Choose Interests</h2>
  <!-- الـ Container الرئيسي لتوزيع الكروت بـ Grid -->
  <div class="container">
    <!-- كل الكروت تأخذ نفس الـ class -->
    <div class="card">
      <label for="br">
        <input id="br" type="checkbox" name="category" value="Binary">
        <i class="fa-solid fa-square-binary"></i>
        <span>Binary</span>
      </label>
    </div>
    <div class="card">
      <label for="sc">
        <input id="sc" type="checkbox" name="category" value="Scheme">
        <i class="fa-solid fa-code-pull-request"></i>
        <span>Scheme</span>
      </label>
    </div>
    <div class="card">
      <label for="dr">
        <input id="dr" type="checkbox" name="category" value="Drawing">
        <i class="fa-solid fa-brush"></i>
        <span>Drawing</span>
      </label>
    </div>
    <div class="card">
      <label for="web">
        <input id="web" type="checkbox" name="category" value="Web">
        <i class="fa-solid fa-display"></i>
        <span>Web</span>
      </label>
    </div>
    <div class="card">
      <label for="bug">
        <input id="bug" type="checkbox" name="category" value="Bug">
        <i class="fa-solid fa-bug"></i>
        <span>Bug</span>
      </label>
    </div>
    <div class="card">
      <label for="cloud">
        <input id="cloud" type="checkbox" name="category" value="Cloud">
        <i class="fa-solid fa-cloud"></i>
        <span>Cloud</span>
      </label>
    </div>
    <div class="card">
      <label for="cod">
        <input id="cod" type="checkbox" name="category" value="Coding">
        <i class="fa-solid fa-award"></i>
        <span>Coding</span>
      </label>
    </div>
    <div class="card">
      <label for="puz">
        <input id="puz" type="checkbox" name="category" value="Puzzle">
        <i class="fa-solid fa-puzzle-piece"></i>
        <span>Puzzle</span>
      </label>
    </div>
  </div>
  <!-- End Choose Interests -->
</body>
</html>
